# The factual-QA chain-of-verification recipe: one pydantic-ai agent per courtroom role.
# API keys never live here: set COVE__<ROLE>__PROVIDER_CONFIG__API_KEY in .env (see .env.sample).
# Top-level `x-` blocks are YAML anchors for the roles below; the loader drops them before validation.
#
# A role is a provider_config and a model_name, plus, optionally:
#   model_settings  pydantic-ai ModelSettings (temperature, max_tokens, thinking, timeout, ...); a typo fails loudly
#   output_mode     auto (default) | tool | native | prompted: how the model is made to answer in the schema
#   output_retries  retries after a response fails validation, each showing the model the errors (default 1)
# Each provider's SDK retries transient HTTP errors on its own.

x-openai-provider-config: &openai-provider-config
  provider: openai

x-anthropic-provider-config: &anthropic-provider-config
  provider: anthropic

x-gemini-provider-config: &gemini-provider-config
  provider: google

x-deterministic-settings: &deterministic-settings
  temperature: 0.0
  max_tokens: 2000

cove:
  # factored: one isolated witness per question | two_step: one panel call | joint: one inquisitor call
  procedure: factored

  limits:
    max_concurrent_steps: 8
    max_concurrent_runs: 3
    timeout_s: 120
    witness_timeout_s: 60
    quorum: 1.0

  # Drafts the baseline answer.
  proponent:
    provider_config: *gemini-provider-config
    model_name: gemini-2.5-flash
    model_settings: *deterministic-settings

  # Plans open verification questions that challenge the answer (also plays the joint inquisitor).
  contrarian:
    provider_config: *openai-provider-config
    model_name: gpt-4o-mini
    model_settings:
      <<: *deterministic-settings
      max_tokens: 3000

  # Answers each question without ever seeing the proposed answer (also plays the two-step panel).
  witness:
    provider_config: *openai-provider-config
    model_name: gpt-4o-mini
    model_settings: *deterministic-settings

  # Rules on the proposed answer given the evidence, correcting it where the evidence disagrees.
  # To rule with Claude instead: provider_config: *anthropic-provider-config, model_name: claude-sonnet-5-5.
  judge:
    provider_config: *openai-provider-config
    model_name: gpt-4o-mini
    model_settings: *deterministic-settings
