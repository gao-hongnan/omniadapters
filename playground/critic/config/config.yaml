# The factual-QA chain-of-verification recipe: one LLM per courtroom role.
# API keys never live here: set COVE__<ROLE>__PROVIDER_CONFIG__API_KEY in .env (see .env.sample).
# Top-level `x-` blocks are YAML anchors for the roles below; the loader drops them before validation.

x-openai-provider-config: &openai-provider-config
  provider: openai
  max_retries: 3

x-openai-completion-params: &openai-completion-params
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0

x-instructor-config-openai: &instructor-config-openai
  mode: tool_call

x-anthropic-provider-config: &anthropic-provider-config
  provider: anthropic
  max_retries: 3

x-anthropic-completion-params: &anthropic-completion-params
  provider: anthropic
  model: claude-sonnet-5-5
  temperature: 0.0
  max_tokens: 2000

x-instructor-config-anthropic: &instructor-config-anthropic
  mode: anthropic_tools

x-gemini-provider-config: &gemini-provider-config
  provider: google

x-gemini-completion-params: &gemini-completion-params
  provider: google
  model: gemini-2.5-flash
  temperature: 0.0
  max_output_tokens: 2000

x-instructor-config-gemini: &instructor-config-gemini
  mode: genai_structured_outputs

cove:
  # factored: one isolated witness per question | two_step: one panel call | joint: one inquisitor call
  procedure: factored

  limits:
    max_concurrent_steps: 8
    max_concurrent_runs: 3
    timeout_s: 120
    witness_timeout_s: 60
    quorum: 1.0

  # Drafts the baseline answer.
  proponent:
    provider_config: *gemini-provider-config
    completion_params: *gemini-completion-params
    instructor_config: *instructor-config-gemini

  # Plans open verification questions that challenge the answer (also plays the joint inquisitor).
  contrarian:
    provider_config: *openai-provider-config
    completion_params:
      <<: *openai-completion-params
      max_tokens: 3000
    instructor_config: *instructor-config-openai

  # Answers each question without ever seeing the proposed answer (also plays the two-step panel).
  witness:
    provider_config: *openai-provider-config
    completion_params:
      <<: *openai-completion-params
      max_tokens: 2000
    instructor_config: *instructor-config-openai

  # Rules on the proposed answer given the evidence, correcting it where the evidence disagrees.
  judge:
    provider_config: *openai-provider-config
    completion_params:
      <<: *openai-completion-params
      max_tokens: 2000
    instructor_config: *instructor-config-openai
